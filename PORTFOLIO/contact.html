    <br>
<button name="Register" onclick="register()">Register</button>

<script>
    function register() {
        var Name = document.getElementById('name').value;
        var Number = document.getElementById('num').value;
        var Address = document.getElementById('address').value;
        var Email = document.getElementById('Email').value;
        var Date = document.getElementById('date').value;
        var group = document.querySelector('input[name=group]:checked').value;
        alert("Account Registered!" + "\nName: " + Name + "\nNumber: " + Number + "\nAddress: " + Address + "\nEmail: " + Email + "\nBirthdate: " + Date + "\nGroup: " + group);
    }
</script>
