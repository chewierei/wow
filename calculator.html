<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Calculator</title>
    <link rel="stylesheet" href="calculator.css">
</head>
<body>
     <nav>
        <ul>
            <li><a href="rev2.html">Works</a></li>
            <li><a href="lesson.html">Lesson</a></li>
            <li><a href="resume.html">Resume</a></li>
            <li><a href="gallery.html">Gallery</a></li>
            <li><a href="contact.html">Contact</a></li>
            <li><a href="schedule.html">Schedule</a></li>
            <li><a href="multi.html">Multimedia</a></li>
            <li><a href="wallclock.html">Wallclock</a></li>
        </ul>
    </nav>

    <div class="cal-box">
        <div class="box">
            <form name="form1" action="">
                <input type="text" class="inputvalue" name="inputvalue">
            </form>
            <section>
                <div class="container">
                    <button value="C" onclick="form1.inputvalue.value = ''">C</button>
                    <button value="B" onclick="backspace()">B</button>
                    <button value="/" onclick="insert('/')">/</button>
                    <button value="*" onclick="insert('*')">*</button>

                    <button value="7" onclick="insert(7)">7</button>
                    <button value="8" onclick="insert(8)">8</button>
                    <button value="9" onclick="insert(9)">9</button>
                    <button value="-" onclick="insert('-')">-</button>

                    <button value="4" onclick="insert(4)">4</button>
                    <button value="5" onclick="insert(5)">5</button>
                    <button value="6" onclick="insert(6)">6</button>
                    <button value="+" onclick="insert('+')">+</button>

                    <button value="1" onclick="insert(1)">1</button>
                    <button value="2" onclick="insert(2)">2</button>
                    <button value="3" onclick="insert(3)">3</button>

                    <button class="equal" value="=" onclick="equal()">=</button>
                    <button class="zero" value="0" onclick="insert(0)">0</button>
                    <button class="zero" value="00" onclick="insert('00')">00</button>
                    <button value="." onclick="insert('.')">.</button>
                </div>
            </section>
        </div>
    </div>
</body>
</html>

<script src="calculator.js"> </script>
